[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futurecast-bench"
version = "0.1.0"
description = "Open-box utilities for FutureCast-Bench context-aware forecasting datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
futurecast = "futurecast_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
futurecast_bench = ["configs/*.yaml"]
